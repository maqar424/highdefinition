<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolja Grosse | high definition</title>
    <link rel="icon" type="image/svg+xml" href="/css/camera.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <nav class="back-nav">
        <a href="/index.html" class="back-link">← high definition</a>
    </nav>

    <header>
        <h1>kolja's galleries</h1>
        <div class="description">Kuratierte Momente aus aller Welt.</div>
    </header>

    <div class="tag-filter" id="tag-filter"></div>

    <main id="gallery-sections">
        <!-- Jahres-Abschnitte werden per JS aus DynamoDB geladen -->
    </main>

    <script>
        const API_URL        = "https://ejjvnnn1lj.execute-api.eu-central-1.amazonaws.com/gallery";
        const MEDIA_BASE_URL = "https://high-definition.net/media/";
        const USER_ID        = "koljagrosse";

        let allGalleries = [];
        const activeTags = new Set();

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function fmtDate(iso) {
            if (!iso) return '';
            const [y, m, d] = iso.split('-');
            return `${d}.${m}.${y}`;
        }

        function fmtSpan(s, e) {
            if (s && e && s !== e) return `${fmtDate(s)} – ${fmtDate(e)}`;
            return fmtDate(s || e);
        }

        function yearOf(g) {
            const d = g.StartDate || g.EndDate || '';
            return d ? d.slice(0, 4) : null;
        }

        async function loadGalleries() {
            const main = document.getElementById('gallery-sections');
            try {
                const res = await fetch(`${API_URL}?userId=${USER_ID}&galleriesOnly=true`);
                if (!res.ok) throw new Error(`API ${res.status}`);
                allGalleries = await res.json();

                if (allGalleries.length === 0) {
                    main.innerHTML = '<p class="empty-note">Noch keine Galerien vorhanden.</p>';
                    return;
                }
                renderFilterBar();
                renderGalleries();
            } catch (err) {
                console.error('Fehler beim Laden der Galerien:', err);
                main.innerHTML = '<p class="empty-note">Fehler beim Laden.</p>';
            }
        }

        function renderFilterBar() {
            const bar = document.getElementById('tag-filter');
            const tags = [...new Set(allGalleries.flatMap(g => Array.isArray(g.Tags) ? g.Tags : []))]
                .sort((a, b) => a.localeCompare(b, 'de'));
            if (tags.length === 0) { bar.innerHTML = ''; return; }

            bar.innerHTML = tags.map(t =>
                `<button class="filter-tag${activeTags.has(t) ? ' active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`
            ).join('');

            bar.querySelectorAll('.filter-tag').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.tag;
                    if (activeTags.has(t)) activeTags.delete(t);
                    else                   activeTags.add(t);
                    btn.classList.toggle('active');
                    renderGalleries();
                });
            });
        }

        function tileHtml(g) {
            const slug  = g.Slug || g.GalleryId.replace('GALLERY#', '');
            const title = g.Title || slug;
            const thumb = g.ThumbnailUrl ? `${MEDIA_BASE_URL}${g.ThumbnailUrl}` : '';
            const href  = `/${USER_ID}/${slug}/index.html`;
            const span  = fmtSpan(g.StartDate, g.EndDate);
            const dateEl = span ? `<div class="gallery-date">${span}</div>` : '';
            const cls   = thumb ? 'gallery-tile' : 'gallery-tile gallery-tile--placeholder';
            const imgEl = thumb ? `<img src="${thumb}" class="profile-thumbnail" alt="${escapeHtml(title)}">` : '';
            return `
                <a href="${href}" class="${cls}">
                    ${imgEl}
                    <h2 class="gallery-title">${escapeHtml(title)}</h2>
                    ${dateEl}
                </a>`;
        }

        function renderGalleries() {
            const main = document.getElementById('gallery-sections');

            // Filter (ODER: Galerie erscheint, wenn sie mind. einen aktiven Tag hat)
            let list = allGalleries;
            if (activeTags.size) {
                list = list.filter(g => (Array.isArray(g.Tags) ? g.Tags : []).some(t => activeTags.has(t)));
            }

            // Nach Datum absteigend sortieren (neueste zuerst)
            list = [...list].sort((a, b) => (b.StartDate || '').localeCompare(a.StartDate || ''));

            // Nach Jahr gruppieren
            const byYear = {};
            const undated = [];
            for (const g of list) {
                const y = yearOf(g);
                if (y) (byYear[y] ||= []).push(g);
                else   undated.push(g);
            }

            const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a));
            let html = '';
            for (const y of years) {
                html += `<h2 class="year-heading">${y}</h2>
                         <div class="gallery-tile-grid">${byYear[y].map(tileHtml).join('')}</div>`;
            }
            if (undated.length) {
                html += `<h2 class="year-heading">Ohne Datum</h2>
                         <div class="gallery-tile-grid">${undated.map(tileHtml).join('')}</div>`;
            }
            if (!html) html = '<p class="empty-note">Keine Galerien für diese Filter.</p>';
            main.innerHTML = html;
        }

        loadGalleries();
    </script>

</body>
</html>
